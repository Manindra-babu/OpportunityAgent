<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Global Radar Web Concentric Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8" stroke-dasharray="16 16" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="8" />

  <!-- Interconnected Network Nodes -->
  <line x1="156" y1="256" x2="256" y2="156" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="6" />
  <line x1="256" y1="156" x2="356" y2="256" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="6" />
  <line x1="356" y1="256" x2="256" y2="356" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="6" />
  <line x1="256" y1="356" x2="156" y2="256" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="6" />

  <!-- Network Corner Nodes -->
  <circle cx="156" cy="256" r="14" fill="#60A5FA" />
  <circle cx="256" cy="156" r="14" fill="#38BDF8" />
  <circle cx="356" cy="256" r="14" fill="#818CF8" />
  <circle cx="256" cy="356" r="14" fill="#A78BFA" />

  <!-- Central Opportunity Rocket / Spark Star (Agent Core) -->
  <g filter="url(#glow)">
    <path d="M256 120 C256 180 200 256 120 256 C200 256 256 332 256 392 C256 332 312 256 392 256 C312 256 256 180 256 120 Z" fill="url(#sparkGrad)" />
  </g>
</svg>